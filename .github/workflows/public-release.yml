name: public-release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/../amlas-public-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate recursive DOX coverage
        run: python scripts/dox_lint.py . --recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: python -m pip install --no-cache-dir uv==0.8.8
      - run: uv sync --frozen --extra dev --extra security --extra cdk --extra agents --extra runtime-cpu
      - run: uv run --frozen --no-sync python -m pytest -q tests
      - run: uv run --frozen --no-sync python scripts/verify_repository_governance.py --scan-tree --ref HEAD
      - run: uv run --frozen --no-sync ruff check src scripts infra tests
      - run: uv run --frozen --no-sync bandit -c pyproject.toml -r src scripts infra -lll
      - run: uv export --frozen --format requirements-txt --no-emit-project > "${RUNNER_TEMP}/requirements.txt"
      - run: uv run --frozen --no-sync pip-audit -r "${RUNNER_TEMP}/requirements.txt" --strict
      - run: git ls-files -z | xargs -0 uv run --frozen --no-sync detect-secrets-hook --baseline .secrets.baseline
      - run: uv run --frozen --no-sync cyclonedx-py requirements "${RUNNER_TEMP}/requirements.txt" --output-format JSON -o sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyclonedx-sbom
          path: sbom.json
